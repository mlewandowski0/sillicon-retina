site_name: Silicon Retina Documentation
site_description: "Technical documentation, equations, diagrams, and more."
site_dir: ../docs

# (Optional) If you have a custom domain or a custom URL:
# site_url: https://<username>.github.io/<repo-name>/

theme:
  name: material

# Enable Markdown extensions and plugins
markdown_extensions:
  - pymdownx.arithmatex:        # Renders LaTeX-style equations via MathJax
      generic: true
  - pymdownx.betterem:          # Improves emphasis parsing
  - pymdownx.caret:             # Adds support for ^ superscripts
  - pymdownx.inlinehilite:      # Inline code highlight
  - pymdownx.keys:              # Keyboard key styling
  - pymdownx.blocks.tab
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.blocks.tab
  - toc:                        # Table of contents support
      permalink: true
  - pymdownx.mark:              # ===mark=== highlights
  - pymdownx.smartsymbols       # Replaces certain ASCII sequences with symbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


# Enable Mermaid support (Material for MkDocs ships with built-in Mermaid JS)
extra_javascript:
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  mermaid:
    version: "8.13.5"
    # (You can pin a specific mermaid version if you want)

# If you want a search box in your docs:
plugins:
  - search

# (Optional) If you want more navigation control, list pages here:
nav:
  - Home: index.md
  - Model and SCAMP5 Implementation: model_and_scamp5_impl.md
  - Creating Artificial Dataset: creating_artificial_dataset.md
  - Training and Testing: training_and_testing.md